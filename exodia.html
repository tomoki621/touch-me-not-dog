<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>封印されしエクゾディア</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap">
<style>
  /* 最小限。ここが効かないとタップできなくなるので HTML に直接置く。 */
  html,body{height:100%;margin:0;overflow:hidden;background:#0d0a04;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;color:#efe9f8}
  #gate{position:fixed;inset:0;z-index:9;cursor:pointer;background:#0d0a04;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;padding:34px 28px;text-align:center}
  #hud,#sub{opacity:0}
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>
<canvas id="gl"></canvas>

<!-- WebXR の dom-overlay に渡す入れ物。中の操作だけが AR の映像に重なる。
     canvas を含めてしまうと XR の描画の上に二重に乗るので、外に置く。 -->
<div id="ov">
  <div id="touch"></div>
  <div id="cross"><i></i><i></i></div>
  <div id="flash"></div>

  <div id="hud">
    <!-- WebXR の dom-overlay では2本目の指が届かない端末がある。指が使えなくても
         詰まないよう、大きさと向きはボタンからも変えられるようにしておく。 -->
    <div id="tune">
      <button class="tb" id="tSmall" aria-label="小さく">−</button>
      <button class="tb" id="tBig"   aria-label="大きく">＋</button>
      <button class="tb" id="tCcw"   aria-label="左に回す">↺</button>
      <button class="tb" id="tCw"    aria-label="右に回す">↻</button>
    </div>
    <div id="sub">
      <button class="sb" id="bReset">封印しなおす</button>
      <button class="sb" id="bHome">置き直す</button>
    </div>
    <!-- 技。立たせるまでは押せない。読み上げでは正式な名で読ませる。 -->
    <button id="fire" disabled aria-label="怒りの業火 魔神火炎砲 エグゾード・フレイム"><span>怒りの業火</span>エグゾード・フレイム</button>
    <button id="call">召　喚</button>
    <div id="tip">床やカードに輪を合わせてから召喚<br>2本指、またはボタンで大きさと向き</div>
  </div>
</div>

<div id="gate">
  <h1>封印されし<br>エクゾディア</h1>
  <p>5枚のカードを並べ、その真ん中にかざしてください。<br>揃ったとき、封印は解かれます。</p>
  <div id="tapme">画面をタップして開始</div>
  <p id="note"></p>
</div>

<script>
// HTML は GitHub Pages に10分キャッシュされる。中身を HTML に置くと修正が届かない。
// CSS も JS も外部ファイルにして、版番号だけ毎回取りに行って付ける。
// no-store を無視する端末があるので、URL 自体も毎回変える。
fetch("build.json?t=" + Date.now(), {cache:"no-store"}).then(r => r.json()).then(v => {
  const l = document.createElement("link");
  l.rel = "stylesheet"; l.href = "exodia.css?h=" + v.exCss;
  document.head.appendChild(l);
  const s = document.createElement("script");
  s.src = "exodia.js?h=" + v.ex;
  document.body.appendChild(s);
}).catch(() => {
  const t = Date.now();
  const l = document.createElement("link");
  l.rel = "stylesheet"; l.href = "exodia.css?t=" + t;
  document.head.appendChild(l);
  const s = document.createElement("script");
  s.src = "exodia.js?t=" + t;
  document.body.appendChild(s);
});
</script>
</body>
</html>
