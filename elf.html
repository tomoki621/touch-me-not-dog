<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>エルフの剣士</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap">
<style>
  /* 最小限。ここが効かないとタップできなくなるので HTML に直接置く。 */
  html,body{height:100%;margin:0;overflow:hidden;background:#111d16;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;color:#e6f0e4}
  #gate{position:fixed;inset:0;z-index:9;cursor:pointer;background:#111d16;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;padding:34px 28px;text-align:center}
  #hud,#acts{opacity:0}
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>
<canvas id="gl"></canvas>

<!-- WebXR の dom-overlay に渡す入れ物。中の操作だけが AR の映像に重なる。
     canvas を含めてしまうと XR の描画の上に二重に乗るので、外に置く。 -->
<div id="ov">
  <div id="touch"></div>
  <div id="cross"><i></i><i></i></div>

  <!-- 動作。置いてから出す。置く前に押せると、宙で構えることになる。 -->
  <div id="acts">
    <!-- 盾は持たない。守備は剣を横に寝かせ、ひざをついて受ける。 -->
    <button class="act" id="aGuard" aria-label="ひざをついて剣で守る">
      <svg viewBox="0 0 24 24"><path d="M3.5 10.5h14"/><path d="M17.5 8.6v3.8"/><path d="M17.5 10.5h3"/><path d="M6 14.5 4.5 20"/><path d="M12 14.5 15 18l4 .6"/></svg>
    </button>
    <button class="act" id="aSword" aria-label="剣をふる">
      <svg viewBox="0 0 24 24"><path d="M20.5 3.5 11 13"/><path d="m7.6 12.6 3.8 3.8"/><path d="M9.5 14.5 4.6 19.4"/><path d="m3.4 18.6 2 2"/></svg>
    </button>
  </div>

  <div id="hud">
    <!-- WebXR の dom-overlay では2本目の指が届かない端末がある。指が使えなくても
         詰まないよう、大きさと向きはボタンからも変えられるようにしておく。 -->
    <div id="tune">
      <button class="tb" id="tSmall" aria-label="小さく">−</button>
      <button class="tb" id="tBig"   aria-label="大きく">＋</button>
      <button class="tb" id="tCcw"   aria-label="左に回す">↺</button>
      <button class="tb" id="tCw"    aria-label="右に回す">↻</button>
    </div>
    <div id="sub">
      <button class="sb" id="bPlace">置　く</button>
      <button class="sb" id="bHome">置き直す</button>
    </div>
    <div id="tip">床や机に輪を合わせて「置く」</div>
  </div>
</div>

<pre id="dbg" style="display:none"></pre>

<div id="gate">
  <h1>エルフの剣士</h1>
  <p>床や机に立たせて、守備・剣で追い払わせて撮ってください。<br>カードは要りません。</p>
  <div id="tapme">画面をタップして開始</div>
  <p id="note"></p>
</div>

<script>
// HTML は GitHub Pages に10分キャッシュされる。中身を HTML に置くと修正が届かない。
// CSS も JS も外部ファイルにして、版番号だけ毎回取りに行って付ける。
// no-store を無視する端末があるので、URL 自体も毎回変える。
fetch("build.json?t=" + Date.now(), {cache:"no-store"}).then(r => r.json()).then(v => {
  const l = document.createElement("link");
  l.rel = "stylesheet"; l.href = "elf.css?h=" + v.elfCss;
  document.head.appendChild(l);
  const s = document.createElement("script");
  s.src = "elf.js?h=" + v.elf;
  document.body.appendChild(s);
}).catch(() => {
  const t = Date.now();
  const l = document.createElement("link");
  l.rel = "stylesheet"; l.href = "elf.css?t=" + t;
  document.head.appendChild(l);
  const s = document.createElement("script");
  s.src = "elf.js?t=" + t;
  document.body.appendChild(s);
});
</script>
</body>
</html>
