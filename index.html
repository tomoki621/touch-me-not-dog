<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>触らせてくれない</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap">
<style>
  :root{
    --bg:#e9e4ee; --fg:#241c33; --dim:#6d6280;
    --accent:#2a5bd7; --hot:#e8202a; --bad:#c4523a;
    --glass:#e9e4eed9; --line:#241c3326; --shadow:#00000026;
    --display:"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#191424; --fg:#efe9f8; --dim:#9a8fb0;
      --accent:#5b86ef; --hot:#ff5560; --bad:#e8705a;
      --glass:#191424cc; --line:#efe9f833; --shadow:#00000099;
    }
  }
  :root[data-theme="dark"]{
    --bg:#191424; --fg:#efe9f8; --dim:#9a8fb0;
    --accent:#5b86ef; --hot:#ff5560; --bad:#e8705a;
    --glass:#191424cc; --line:#efe9f833; --shadow:#00000099;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#000;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;color:var(--fg);
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none}

  #ar{position:fixed;inset:0;overflow:hidden}
  /* 手の領域だけ実写を描き戻すレイヤー。3Dより前、HUDより後ろ。 */
  #occ{position:fixed;inset:0;pointer-events:none;z-index:2}
  #touch{position:fixed;inset:0;z-index:3;touch-action:none}

  /* カードを探している間だけ出る枠 */
  #scan{position:fixed;inset:0;z-index:4;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    transition:opacity .45s}
  #scan.gone{opacity:0}
  #frame{width:min(56vw,230px);aspect-ratio:59/86;border-radius:10px;
    border:2px dashed #ffffff99;box-shadow:0 0 0 100vmax #00000055;
    animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  #scanTxt{font-size:14px;letter-spacing:.06em;color:#fff;text-shadow:0 2px 10px #000c}

  #acts{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:50%;z-index:5;
    transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;
    opacity:0;pointer-events:none;transition:opacity .45s}
  #acts.on{opacity:1;pointer-events:auto}
  .act{-webkit-appearance:none;appearance:none;width:58px;height:58px;padding:0;
    border-radius:50%;border:1px solid var(--line);background:var(--glass);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    color:var(--fg);cursor:pointer;display:grid;place-items:center;
    box-shadow:0 3px 14px var(--shadow);transition:transform .09s,background .12s}
  .act svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .act:active,.act.hit{transform:scale(.9);background:var(--accent);color:#fff}
  .act:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .pop{position:fixed;pointer-events:none;z-index:6;transform:translate(-50%,-50%);
    font-family:var(--display);font-size:34px;white-space:nowrap;
    text-shadow:0 2px 12px #000b;animation:pop .7s cubic-bezier(.2,.9,.3,1) forwards}
  @keyframes pop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-8deg)}
    22%{opacity:1;transform:translate(-50%,-64%) scale(1.15) rotate(3deg)}
    100%{opacity:0;transform:translate(-50%,-130%) scale(1) rotate(0)}
  }
  @media (prefers-reduced-motion: reduce){
    .pop{animation-duration:.4s}
    #frame{animation:none;opacity:.85}
  }

  /* カメラ許可はユーザー操作起点でないとブラウザが弾く。この1タップだけは消せない。 */
  #gate{position:fixed;inset:0;z-index:9;background:var(--bg);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;padding:34px 28px;text-align:center;transition:opacity .5s}
  #gate.gone{opacity:0;pointer-events:none}
  #gate h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,50px);
    margin:0;letter-spacing:-.01em;text-wrap:balance;line-height:1.25}
  #gate p{margin:0;max-width:25em;font-size:14px;line-height:1.9;color:var(--dim)}
  #tapme{font-size:13px;letter-spacing:.14em;color:var(--accent);
    animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
  #note{font-size:12.5px;line-height:1.8;color:var(--bad);min-height:1.5em;max-width:28em;margin:0}
  @media (prefers-reduced-motion: reduce){ #tapme{animation:none;opacity:1} }

  /* どこで止まっているかを推測しないための表示。原因が分かったら消す。 */
  #dbg{position:fixed;left:0;bottom:0;z-index:7;margin:0;padding:8px 12px;
    padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.65;
    color:#fff;background:#000000aa;white-space:pre;pointer-events:auto;cursor:pointer}
  #dbg.hidden{opacity:.25}
</style>
</head>
<body>

<div id="ar"></div>
<canvas id="occ"></canvas>
<div id="touch"></div>

<div id="scan">
  <div id="frame"></div>
  <div id="scanTxt">ルイーズのカードを写してください</div>
</div>

<div id="acts">
  <button class="act" id="aShield" aria-label="盾でふせぐ">
    <svg viewBox="0 0 24 24"><path d="M12 3.2 5.2 5.9v5.2c0 4.2 2.8 7.4 6.8 8.7 4-1.3 6.8-4.5 6.8-8.7V5.9z"/></svg>
  </button>
  <button class="act" id="aRoar" aria-label="威嚇する">
    <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3l4 3.4V6.1L7 9.5z"/><path d="M14.6 9.2a4 4 0 0 1 0 5.6"/><path d="M17.6 6.4a8 8 0 0 1 0 11.2"/></svg>
  </button>
  <button class="act" id="aSword" aria-label="剣をふる">
    <svg viewBox="0 0 24 24"><path d="M20.5 3.5 11 13"/><path d="m7.6 12.6 3.8 3.8"/><path d="M9.5 14.5 4.6 19.4"/><path d="m3.4 18.6 2 2"/></svg>
  </button>
</div>

<pre id="dbg">起動待ち</pre>

<div id="gate">
  <h1>触らせてくれない</h1>
  <p>ルイーズのカードにかざすと、その上に立ちます。<br>盾・威嚇・剣で追い払わせて撮ってください。</p>
  <div id="tapme">画面をタップして開始</div>
  <p id="note"></p>
</div>

<script src="app.js?v=2"></script>
</body>
</html>
