<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>触らせてくれない</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap">
<style>
  /* 柴犬の毛色から起こしたウォームな中間色。灰色ではなく、橙に寄せた黒と紙。 */
  :root{
    --bg:#efe6d6; --fg:#2b241b; --dim:#7c6d58;
    --accent:#e8792e; --bad:#c4523a;
    --glass:#efe6d6d9; --line:#2b241b26; --shadow:#00000026; --on-ink:#2b241b;
    --display:"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1815; --fg:#f6efe2; --dim:#a1937f;
      --accent:#e8792e; --bad:#e8705a;
      --glass:#1b1815cc; --line:#f6efe233; --shadow:#00000099; --on-ink:#1b1815;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1815; --fg:#f6efe2; --dim:#a1937f;
    --accent:#e8792e; --bad:#e8705a;
    --glass:#1b1815cc; --line:#f6efe233; --shadow:#00000099; --on-ink:#1b1815;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;color:var(--fg);
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none}

  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #cv{position:fixed;inset:0;display:block;touch-action:none}

  /* 操作は右手の親指が届く縦一列。撮影中に見ないで押せる位置。 */
  #acts{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:50%;
    transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;
    opacity:0;pointer-events:none;transition:opacity .45s}
  #acts.on{opacity:1;pointer-events:auto}
  .act{-webkit-appearance:none;appearance:none;width:58px;height:58px;padding:0;
    border-radius:50%;border:1px solid var(--line);background:var(--glass);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    color:var(--fg);cursor:pointer;display:grid;place-items:center;
    box-shadow:0 3px 14px var(--shadow);transition:transform .09s,background .12s}
  .act svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .act:active,.act.hit{transform:scale(.9);background:var(--accent);color:var(--on-ink)}
  .act:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* 設置中だけ出る。決めたら二度と出てこない。 */
  #setup{position:fixed;left:0;right:0;bottom:0;
    padding:0 18px calc(20px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;align-items:center;gap:14px;
    transition:opacity .4s}
  #setup.gone{opacity:0;pointer-events:none}
  #tip{font-size:13px;line-height:1.7;letter-spacing:.03em;text-align:center;
    padding:9px 16px;border-radius:14px;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:22em}
  #ok{-webkit-appearance:none;appearance:none;border:none;border-radius:999px;
    background:var(--accent);color:var(--on-ink);font:inherit;font-size:15px;font-weight:700;
    padding:14px 34px;cursor:pointer;box-shadow:0 4px 16px var(--shadow)}
  #ok:active{transform:scale(.96)}

  /* 描き文字。効果音のかわり。 */
  .pop{position:fixed;pointer-events:none;transform:translate(-50%,-50%);
    font-family:var(--display);font-size:34px;white-space:nowrap;
    text-shadow:0 2px 12px var(--shadow);animation:pop .7s cubic-bezier(.2,.9,.3,1) forwards}
  @keyframes pop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-8deg)}
    22%{opacity:1;transform:translate(-50%,-64%) scale(1.15) rotate(3deg)}
    100%{opacity:0;transform:translate(-50%,-130%) scale(1) rotate(0)}
  }
  @media (prefers-reduced-motion: reduce){ .pop{animation-duration:.4s} }

  /* カメラ許可はユーザー操作起点でないとブラウザが弾くので、この1タップだけは消せない。 */
  #gate{position:fixed;inset:0;z-index:9;background:var(--bg);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;padding:34px 28px;text-align:center;transition:opacity .5s}
  #gate.gone{opacity:0;pointer-events:none}
  #gate h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,50px);
    margin:0;letter-spacing:-.01em;text-wrap:balance;line-height:1.25}
  #gate p{margin:0;max-width:25em;font-size:14px;line-height:1.9;color:var(--dim)}
  #tapme{font-size:13px;letter-spacing:.14em;color:var(--accent);
    animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
  #note{font-size:12.5px;line-height:1.75;color:var(--bad);min-height:1.5em;max-width:27em;margin:0}
  @media (prefers-reduced-motion: reduce){ #tapme{animation:none;opacity:1} }
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>
<canvas id="cv"></canvas>

<div id="acts">
  <button class="act" id="aShield" aria-label="盾でふせぐ">
    <svg viewBox="0 0 24 24"><path d="M12 3.2 5.2 5.9v5.2c0 4.2 2.8 7.4 6.8 8.7 4-1.3 6.8-4.5 6.8-8.7V5.9z"/></svg>
  </button>
  <button class="act" id="aRoar" aria-label="ほえる">
    <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3l4 3.4V6.1L7 9.5z"/><path d="M14.6 9.2a4 4 0 0 1 0 5.6"/><path d="M17.6 6.4a8 8 0 0 1 0 11.2"/></svg>
  </button>
  <button class="act" id="aSword" aria-label="剣をふる">
    <svg viewBox="0 0 24 24"><path d="M20.5 3.5 11 13"/><path d="m7.6 12.6 3.8 3.8"/><path d="M9.5 14.5 4.6 19.4"/><path d="m3.4 18.6 2 2"/></svg>
  </button>
</div>

<div id="setup">
  <div id="tip">ドラッグで立ち位置、2本指で大きさ</div>
  <button id="ok">ここに立たせる</button>
</div>

<div id="gate">
  <h1>触らせてくれない</h1>
  <p>机や床にこの犬を立たせて、盾・咆哮・剣で追い払わせる。<br>撮って遊ぶためのものです。</p>
  <div id="tapme">画面をタップして開始</div>
  <p id="note"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

// headを自前で持てない環境でも全画面タッチ前提のviewportを保証する
var vp = document.querySelector('meta[name="viewport"]');
if (!vp){ vp = document.createElement('meta'); vp.name = 'viewport'; document.head.appendChild(vp); }
vp.setAttribute('content','width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover');

var $ = function(id){ return document.getElementById(id); };
var video = $('cam'), cv = $('cv'), gate = $('gate'), note = $('note'), tapme = $('tapme');
var acts = $('acts'), setupUI = $('setup'), tip = $('tip');

// ---------------------------------------------------------------- three.js 土台
var renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

var scene = new THREE.Scene();
scene.background = null;                 // 後ろのカメラ映像がそのまま世界になる

var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x40382e, 0.8));
var key = new THREE.DirectionalLight(0xfff2dd, 1.5);
key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.near = 0.5; key.shadow.camera.far = 18;
key.shadow.camera.left = -5; key.shadow.camera.right = 5;
key.shadow.camera.top = 5; key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0015;
scene.add(key);
scene.add(key.target);      // 影は接地感の主役。犬をどこへ置いても届くよう光ごと追従させる。
var rim = new THREE.DirectionalLight(0x88aaff, 0.45);
rim.position.set(-3, 2, -2.5);
scene.add(rim);

// 平面検知はしていない。影があるだけで「乗っている」ように見える。
var floor = new THREE.Mesh(new THREE.PlaneGeometry(80,80), new THREE.ShadowMaterial({opacity:0.32}));
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

var FIT_W = 1.05, FIT_H = 1.15;
function resize(){
  var w = innerWidth, h = innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  var t = Math.tan(THREE.MathUtils.degToRad(camera.fov)*0.5);
  var dz = THREE.MathUtils.clamp(Math.max(FIT_H/t, FIT_W/(t*camera.aspect)), 3.6, 6.6);
  camera.position.set(0, 1.75, dz);
  camera.lookAt(0, 0.75, -1.2);   // やや伏せ角。犬が上寄りに座り、手前に床が残る。
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
addEventListener('orientationchange', function(){ setTimeout(resize, 300); });
if (window.visualViewport) visualViewport.addEventListener('resize', resize);

// ---------------------------------------------------------------- 犬（プリミティブ・ボーンなし）
function M(color, rough, metal){
  return new THREE.MeshStandardMaterial({color:color, roughness:rough===undefined?0.85:rough, metalness:metal||0});
}
var matFur=M(0xe0a869,0.9), matCream=M(0xfaf0dc,0.9), matDark=M(0x2b241d,0.6),
    matSteel=M(0xc9d3dc,0.35,0.85), matWood=M(0x8b5a2b,0.8),
    matShield=M(0x9aa4ad,0.45,0.6), matBoss=M(0xe8792e,0.5,0.2),
    matMouth=M(0x4a1f22,0.7);

var dog = new THREE.Group();
scene.add(dog);

// 手前を空けて、奥の面に立たせる。参照動画の構図はこれで、
// 下半分に手が入り込む余白があるから「そこに立っている」ように見える。
dog.position.z = -3.2;
dog.scale.setScalar(1.4);

function add(parent, mesh, x,y,z){
  mesh.position.set(x||0, y||0, z||0);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}
var SPH = new THREE.SphereGeometry(1,24,18);
var CYL = new THREE.CylinderGeometry(1,1,1,16);
var CONE= new THREE.ConeGeometry(1,1,14);

var body = add(dog, new THREE.Mesh(SPH, matFur), 0, 0.86, 0);
body.scale.set(0.52,0.47,0.6);
add(dog, new THREE.Mesh(SPH, matCream), 0, 0.76, 0.16).scale.set(0.40,0.34,0.48);

[[-0.28,0.33],[0.28,0.33],[-0.26,-0.28],[0.26,-0.28]].forEach(function(p){
  add(dog, new THREE.Mesh(CYL, matFur), p[0], 0.24, p[1]).scale.set(0.11,0.48,0.11);
  add(dog, new THREE.Mesh(SPH, matCream), p[0], 0.06, p[1]+0.03).scale.set(0.12,0.07,0.15);
});

var tail = new THREE.Group();
tail.position.set(0, 1.02, -0.5);
dog.add(tail);
add(tail, new THREE.Mesh(SPH, matFur), 0, 0.16, -0.06).scale.set(0.14,0.24,0.14);

var HEAD = new THREE.Vector3(0, 1.45, 0.16);
var head = new THREE.Group();
head.position.copy(HEAD);
dog.add(head);
add(head, new THREE.Mesh(SPH, matFur), 0,0,0).scale.set(0.44,0.40,0.42);
add(head, new THREE.Mesh(SPH, matCream), 0,-0.08,0.34).scale.set(0.24,0.18,0.18);
add(head, new THREE.Mesh(SPH, matDark), 0,-0.03,0.50).scale.set(0.075,0.06,0.06);

// 咆哮で開く口
var mouth = add(head, new THREE.Mesh(SPH, matMouth), 0, -0.15, 0.44);
mouth.scale.set(0.11, 0.012, 0.06);

var ears = [];
[-1,1].forEach(function(s){
  var e = add(head, new THREE.Mesh(CONE, matFur), s*0.26, 0.36, -0.02);
  e.scale.set(0.15,0.30,0.12); e.rotation.z = s*0.28;
  var i = add(head, new THREE.Mesh(CONE, matCream), s*0.255, 0.33, 0.04);
  i.scale.set(0.085,0.20,0.07); i.rotation.z = s*0.28;
  ears.push({outer:e, inner:i, side:s});
});

var eyes = [];
[-1,1].forEach(function(s){
  var g = new THREE.Group();
  g.position.set(s*0.19, 0.08, 0.35);
  head.add(g);
  add(g, new THREE.Mesh(SPH, matDark), 0,0,0).scale.setScalar(0.072);
  add(g, new THREE.Mesh(SPH, M(0xffffff,0.3)), 0.025, 0.028, 0.05).scale.setScalar(0.026);
  eyes.push(g);
});

var SHOULDER_L = new THREE.Vector3(-0.40, 1.05, 0.18);
var SHOULDER_R = new THREE.Vector3( 0.40, 1.05, 0.18);
var ORBIT = 0.80, SHIELD_R = 0.40;

var shield = new THREE.Group();
dog.add(shield);
add(shield, new THREE.Mesh(CYL, matShield), 0,0,0).scale.set(SHIELD_R,0.055,SHIELD_R);
add(shield, new THREE.Mesh(SPH, matBoss), 0,0.05,0).scale.set(0.15,0.06,0.15);
var sRim = add(shield, new THREE.Mesh(new THREE.TorusGeometry(SHIELD_R,0.035,8,28), matSteel), 0,0.01,0);
sRim.rotation.x = Math.PI/2;

var swordPivot = new THREE.Group();
swordPivot.position.copy(SHOULDER_R);
dog.add(swordPivot);
add(swordPivot, new THREE.Mesh(new THREE.BoxGeometry(0.07,0.72,0.02), matSteel), 0.30,0.46,0.10);
add(swordPivot, new THREE.Mesh(new THREE.BoxGeometry(0.24,0.05,0.05), matSteel), 0.30,0.12,0.10);
var grip = add(swordPivot, new THREE.Mesh(CYL, matWood), 0.30,0.02,0.10);
grip.scale.set(0.035,0.18,0.035);

var armL = add(dog, new THREE.Mesh(CYL, matFur), 0,0,0);
var armR = add(dog, new THREE.Mesh(CYL, matFur), 0,0,0);
var handL = add(dog, new THREE.Mesh(SPH, matCream), 0,0,0); handL.scale.setScalar(0.10);
var handR = add(dog, new THREE.Mesh(SPH, matCream), 0,0,0); handR.scale.setScalar(0.10);

// 肩から手先へ円柱を1本引き伸ばすだけ。スキニングもボーンも要らない。
var _up = new THREE.Vector3(0,1,0), _d = new THREE.Vector3();
function stretchLimb(mesh, from, to, thick){
  _d.subVectors(to, from);
  var len = _d.length();
  mesh.position.copy(from).add(to).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(_up, _d.normalize());
  mesh.scale.set(thick, len, thick);
}

// ---------------------------------------------------------------- エフェクト
var slash = new THREE.Mesh(
  new THREE.TorusGeometry(0.62, 0.035, 6, 28, Math.PI*1.15),
  new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0})
);
slash.visible = false;
scene.add(slash);

var shock = new THREE.Mesh(
  new THREE.TorusGeometry(0.5, 0.028, 6, 40),
  new THREE.MeshBasicMaterial({color:0xe8792e, transparent:true, opacity:0})
);
shock.visible = false;
scene.add(shock);

// ---------------------------------------------------------------- 立ち位置と大きさ
var raycaster = new THREE.Raycaster();
var ndc = new THREE.Vector2();
var groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
var _hitPoint = new THREE.Vector3();

function screenToNdc(px, py){
  ndc.x = (px/innerWidth)*2 - 1;
  ndc.y = -(py/innerHeight)*2 + 1;
  return ndc;
}
// タップした床の位置に立たせる。奥を指せば遠く＝小さく見えるので、
// 遠近だけで大きさもだいたい決まる。ピンチはその微調整。
function placeAt(px, py){
  raycaster.setFromCamera(screenToNdc(px, py), camera);
  if (!raycaster.ray.intersectPlane(groundPlane, _hitPoint)) return;
  dog.position.x = THREE.MathUtils.clamp(_hitPoint.x, -12, 12);
  dog.position.z = THREE.MathUtils.clamp(_hitPoint.z, -16, 1.5);
}

var pointers = {}, pointerCount = 0;
var pinchDist0 = 0, pinchScale0 = 1, pinched = false, dragStart = null, dragging = false;
var mode = 'setup';

function pinchDistance(){
  var k = Object.keys(pointers);
  if (k.length < 2) return 0;
  var a = pointers[k[0]], b = pointers[k[1]];
  return Math.hypot(a.x-b.x, a.y-b.y);
}

cv.addEventListener('pointerdown', function(e){
  cv.setPointerCapture(e.pointerId);
  pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
  pointerCount++;
  if (pointerCount === 1){
    dragStart = {x:e.clientX, y:e.clientY};
    dragging = false; pinched = false;
  } else if (pointerCount === 2){
    pinchDist0 = pinchDistance();
    pinchScale0 = dog.scale.x;
    pinched = true;
  }
});

cv.addEventListener('pointermove', function(e){
  if (!pointers[e.pointerId]) return;
  pointers[e.pointerId] = {x:e.clientX, y:e.clientY};

  if (pointerCount >= 2 && pinchDist0 > 0){
    var s = pinchScale0 * (pinchDistance()/pinchDist0);
    dog.scale.setScalar(THREE.MathUtils.clamp(s, 0.3, 4.0));
    return;
  }
  if (pointerCount === 1 && dragStart && !pinched){
    // 12px 動いて初めてドラッグ扱い。撮影中の不用意な一点タップで犬が飛ばないように。
    if (!dragging && Math.hypot(e.clientX-dragStart.x, e.clientY-dragStart.y) > 12) dragging = true;
    if (dragging) placeAt(e.clientX, e.clientY);
  }
});

function endPointer(e){
  if (pointers[e.pointerId]){ delete pointers[e.pointerId]; pointerCount--; }
  if (pointerCount < 2) pinchDist0 = 0;
  if (pointerCount <= 0){
    pointerCount = 0;
    // 設置中は単純タップでも置ける。決定後はドラッグしないと動かない。
    if (mode === 'setup' && dragStart && !dragging && !pinched) placeAt(e.clientX, e.clientY);
    dragStart = null; dragging = false;
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

$('ok').addEventListener('click', function(){
  mode = 'play';
  setupUI.classList.add('gone');
  setTimeout(function(){ setupUI.style.display = 'none'; }, 420);
  acts.classList.add('on');
});

// ---------------------------------------------------------------- 3つの動作
var st = { t:0, swing:0, roar:0, guard:0, guardTarget:0, shakeT:0 };

var WORD_SWORD  = ['ガッ！','シャキン','スパッ','だめ'];
var WORD_ROAR   = ['ワンッ！','ガウッ','ウー…','ほえる'];
var WORD_SHIELD = ['ガードッ','させない','ムッ','ふせぐ'];
function pick(a){ return a[(Math.random()*a.length)|0]; }
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

var _proj = new THREE.Vector3();
function popWord(text){
  // 描き文字は犬の頭の少し上に出す
  _proj.copy(HEAD).applyMatrix4(dog.matrixWorld);
  _proj.y += 0.7 * dog.scale.y;
  _proj.project(camera);
  var x = (_proj.x*0.5+0.5)*innerWidth, y = (-_proj.y*0.5+0.5)*innerHeight;
  var d = document.createElement('div');
  d.className = 'pop';
  d.textContent = text;
  d.style.color = cssVar('--accent');
  d.style.left = THREE.MathUtils.clamp(x, 60, innerWidth-60) + 'px';
  d.style.top  = THREE.MathUtils.clamp(y, 50, innerHeight-90) + 'px';
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 720);
}

function doSword(){ st.swing = 1; st.shakeT = 0.18; popWord(pick(WORD_SWORD)); }
function doRoar(){  st.roar  = 1; st.shakeT = 0.26; popWord(pick(WORD_ROAR)); }
function guardOn(){ st.guardTarget = 1; if (st.guard < 0.2) popWord(pick(WORD_SHIELD)); }
function guardOff(){ st.guardTarget = 0; }

function flash(btn){ btn.classList.add('hit'); setTimeout(function(){ btn.classList.remove('hit'); }, 130); }

$('aSword').addEventListener('click', function(){ doSword(); });
$('aRoar').addEventListener('click', function(){ doRoar(); });
// 盾は押しっぱなしで構え続ける。撮るときに一番使う。
var shieldBtn = $('aShield');
shieldBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); guardOn(); });
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  shieldBtn.addEventListener(ev, guardOff);
});

// 撮影中に画面を見ずに出せるよう、キーでも
addEventListener('keydown', function(e){
  if (mode !== 'play' || e.repeat) return;
  if (e.key === '1'){ guardOn(); flash(shieldBtn); }
  if (e.key === '2'){ doRoar();  flash($('aRoar')); }
  if (e.key === '3'){ doSword(); flash($('aSword')); }
});
addEventListener('keyup', function(e){ if (e.key === '1') guardOff(); });

// ---------------------------------------------------------------- 起動
function boot(){
  if (gate.dataset.busy) return;
  gate.dataset.busy = '1';

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    tapme.style.display = 'none';
    note.textContent = 'このページはHTTPSかlocalhostで開いてください。file:// やIPアドレス直打ちだとブラウザがカメラを許可しません。';
    gate.dataset.busy = '';
    return;
  }
  tapme.textContent = 'カメラの許可を待っています…';
  navigator.mediaDevices.getUserMedia({
    video:{ facingMode:'environment', width:{ideal:1920}, height:{ideal:1080} }, audio:false
  }).then(function(s){
    video.srcObject = s;
    return video.play();
  }).then(function(){
    gate.classList.add('gone');
    setTimeout(function(){ gate.style.display = 'none'; }, 520);
    resize();
  }).catch(function(e){
    tapme.style.display = 'none';
    note.textContent = 'カメラを開けませんでした（' + ((e && e.name) || 'エラー') +
      '）。ブラウザの権限設定でカメラを許可してから開き直してください。';
    gate.dataset.busy = '';
  });
}
gate.addEventListener('click', boot);

// ---------------------------------------------------------------- ループ
var clock = new THREE.Clock();
var _shPos = new THREE.Vector3(), _hand = new THREE.Vector3();
var REST_DIR  = new THREE.Vector3(-0.78,-0.30, 0.35).normalize();  // 盾を下ろした位置
var GUARD_DIR = new THREE.Vector3( 0.00, 0.10, 1.00).normalize();  // 正面に構えた位置
var _dir = new THREE.Vector3();

function tick(){
  requestAnimationFrame(tick);
  var dt = Math.min(clock.getDelta(), 0.05);
  st.t += dt;

  st.swing  = Math.max(0, st.swing - dt*2.6);
  st.roar   = Math.max(0, st.roar  - dt*1.5);
  st.shakeT = Math.max(0, st.shakeT - dt);
  st.guard += (st.guardTarget - st.guard) * (1 - Math.exp(-11*dt));

  key.position.set(dog.position.x + 2.4, 4.4, dog.position.z + 3.0);
  key.target.position.copy(dog.position);
  key.target.updateMatrixWorld();

  var swingU = 1 - st.swing;                  // 0→1 で振り抜ける
  var swingArc = Math.sin(swingU*Math.PI);
  var roarU = Math.sin(Math.min(1, (1-st.roar)*1.4) * Math.PI);

  // --- 盾: 下ろした位置と正面のあいだを行き来する
  _dir.copy(REST_DIR).lerp(GUARD_DIR, st.guard).normalize();
  _shPos.copy(_dir).multiplyScalar(ORBIT + st.guard*0.16).add(HEAD);
  shield.position.copy(_shPos);
  shield.quaternion.setFromUnitVectors(_up, _dir);
  shield.rotateY(st.t*0.5);

  _hand.copy(_shPos).addScaledVector(_dir, -0.10);
  stretchLimb(armL, SHOULDER_L, _hand, 0.075);
  handL.position.copy(_hand);

  // --- 剣: 振りかぶって斬り下ろす
  swordPivot.rotation.z = -0.25 + Math.sin(st.t*1.7)*0.06 - swingArc*2.5;
  swordPivot.rotation.x = swingArc*0.6;
  swordPivot.updateMatrixWorld(true);
  grip.getWorldPosition(_hand);
  dog.worldToLocal(_hand);
  stretchLimb(armR, SHOULDER_R, _hand, 0.075);
  handR.position.copy(_hand);

  // 斬撃の弧
  slash.visible = st.swing > 0.02;
  if (slash.visible){
    slash.position.copy(HEAD).applyMatrix4(dog.matrixWorld);
    slash.position.y -= 0.1*dog.scale.y;
    slash.quaternion.copy(camera.quaternion);
    slash.rotateZ(-0.6 + swingU*1.9);
    slash.scale.setScalar(dog.scale.x * (0.85 + swingU*0.5));
    slash.material.opacity = swingArc*0.85;
  }

  // 咆哮の衝撃波
  shock.visible = st.roar > 0.02;
  if (shock.visible){
    shock.position.copy(HEAD).applyMatrix4(dog.matrixWorld);
    shock.position.z += 0.25*dog.scale.z;
    shock.quaternion.copy(camera.quaternion);
    shock.scale.setScalar(dog.scale.x * (0.5 + (1-st.roar)*2.6));
    shock.material.opacity = st.roar*0.7;
  }

  // --- 体: 振るとき前に踏み込み、ほえるとき仰け反ってから突き出す
  var breathe = Math.sin(st.t*2.4)*0.012;
  body.scale.set(0.52+breathe, 0.47-breathe+roarU*0.05, 0.6);
  dog.rotation.x = -swingArc*0.16 - roarU*0.10;
  dog.rotation.z += ((st.guard*0.06) - dog.rotation.z) * (1 - Math.exp(-6*dt));
  dog.position.y = (swingArc*0.05 + roarU*0.06) * dog.scale.y;

  // 決めの瞬間だけ小さく震わせる。撮ったとき効く。
  var shake = st.shakeT > 0 ? st.shakeT*0.035 : 0;
  head.position.x = (Math.random()-0.5)*shake;
  head.position.y = HEAD.y + (Math.random()-0.5)*shake;
  head.position.z = HEAD.z + roarU*0.16;

  head.rotation.x += ((-roarU*0.35 + swingArc*0.2) - head.rotation.x) * (1 - Math.exp(-14*dt));
  head.rotation.y += ((Math.sin(st.t*0.6)*0.16*(1-st.guard)) - head.rotation.y) * (1 - Math.exp(-4*dt));

  // 口・耳・目
  mouth.scale.set(0.11 + roarU*0.03, 0.012 + roarU*0.16, 0.06 + roarU*0.02);
  ears.forEach(function(e){
    var back = -roarU*0.5 - st.guard*0.25;
    e.outer.rotation.x = back; e.inner.rotation.x = back;
  });
  var sq = 1 - Math.max(roarU, st.guard)*0.45;
  eyes.forEach(function(e){ e.scale.set(1, sq, 1); });

  tail.rotation.z = Math.sin(st.t*(3 + roarU*10))*0.5;
  tail.rotation.x = -0.5;

  renderer.render(scene, camera);
}

resize();
tick();
})();
</script>
